name: Onamae.com RSS to Slack

on:
  schedule:
    # 15分おきに実行（UTC基準。頻度は好みに応じて変更可）
    - cron: "*/15 * * * *"
  workflow_dispatch: {}  # 手動実行もできるようにしておく

# stateファイルをコミットするため書き込み権限を付与
permissions:
  contents: write

jobs:
  check-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v5

      - name: Pythonをセットアップ
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 依存パッケージをインストール
        run: pip install -r requirements.txt

      - name: '[DEBUG] DeepLキーの構造と認証チェック（鍵は漏らさない・終わったら削除）'
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: |
          echo "length=${#DEEPL_API_KEY}"
          case "$DEEPL_API_KEY" in
            *:fx) echo "endswith_fx=yes" ;;
            *)    echo "endswith_fx=no" ;;
          esac
          case "$DEEPL_API_KEY" in
            *[[:space:]]*) echo "has_whitespace=yes" ;;
            *)             echo "has_whitespace=no" ;;
          esac
          echo "hyphens=$(printf '%s' "$DEEPL_API_KEY" | tr -cd '-' | wc -c)"
          echo "--- DeepL Free endpoint (api-free.deepl.com) ---"
          free_http=$(curl -s -o /tmp/free.json -w '%{http_code}' \
            -H "Authorization: DeepL-Auth-Key $DEEPL_API_KEY" \
            https://api-free.deepl.com/v2/usage)
          echo "http=$free_http"
          echo "body=$(head -c 300 /tmp/free.json)"
          echo "--- DeepL Pro endpoint (api.deepl.com) ---"
          pro_http=$(curl -s -o /tmp/pro.json -w '%{http_code}' \
            -H "Authorization: DeepL-Auth-Key $DEEPL_API_KEY" \
            https://api.deepl.com/v2/usage)
          echo "http=$pro_http"
          echo "body=$(head -c 300 /tmp/pro.json)"

      - name: RSSをチェックしてSlackに通知
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: python scripts/notify_slack.py

      - name: 既読状態(state)をコミット
        # 通知ステップが途中で失敗しても、成功済みの既読を確実に保存する
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/seen_ids.json
          # 変更がなければ何もしない
          if git diff --quiet --cached; then
            echo "state に変更なし。コミット/プッシュをスキップします。"
            exit 0
          fi
          git commit -m "Update seen article state [skip ci]"
          # 実行の競合でリモートが先に進んでいることがあるため、
          # rebase してからプッシュ。失敗したらリトライする。
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "プッシュ失敗 ($i回目)。リトライします..."
            sleep 5
          done
          echo "5回リトライしてもプッシュできませんでした。" >&2
          exit 1
